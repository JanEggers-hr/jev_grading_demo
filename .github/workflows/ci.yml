name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Ruff
        run: uvx ruff check .
      - name: Tests (ohne Netz)
        run: uv run --frozen pytest -q
      - name: Dependency-Audit
        run: |
          uv export --frozen --no-dev -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip
